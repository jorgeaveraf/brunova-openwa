name: Brunova overlay

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'brunova/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    name: Overlay policy and safe smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install overlay validation tools
        timeout-minutes: 5
        run: |
          if ! command -v shellcheck >/dev/null || ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck ripgrep
          fi

      - name: Validate tracked policy and scripts
        run: |
          deploy/scripts/ci-policy.sh
          shellcheck deploy/scripts/*.sh

      - name: Create ephemeral CI environment and validate Compose
        run: |
          ci_env="$(mktemp)"
          cp deploy/env.production.example "$ci_env"
          master="owa_k1_$(openssl rand -hex 32)"
          pepper="$(openssl rand -hex 32)"
          sed -i "s/__GENERATE_API_MASTER_KEY__/$master/; s/__GENERATE_API_KEY_PEPPER__/$pepper/" "$ci_env"
          chmod 0600 "$ci_env"
          OPENWA_ENV_FILE="$ci_env" deploy/scripts/validate.sh
          echo "OPENWA_CI_ENV=$ci_env" >> "$GITHUB_ENV"

      - name: Safe container smoke test (no session, no QR, no sends)
        timeout-minutes: 10
        run: OPENWA_ENV_FILE="$OPENWA_CI_ENV" deploy/scripts/deploy.sh

      - name: Stop ephemeral stack
        if: always()
        run: |
          if [ -n "${OPENWA_CI_ENV:-}" ] && [ -f "$OPENWA_CI_ENV" ]; then
            OPENWA_RUNTIME_ENV_FILE="$OPENWA_CI_ENV" docker compose --project-directory deploy --env-file "$OPENWA_CI_ENV" -f deploy/compose.production.yml down -v || true
            : > "$OPENWA_CI_ENV"
          fi

      - name: Gitleaks overlay history scan
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="$(mktemp)"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          scan_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$scan_dir" gitleaks
          base="$(tr -d '[:space:]' <.brunova-upstream-base)"
          "$scan_dir/gitleaks" git --redact --no-banner --log-opts="${base}..HEAD" .

  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  image-scan:
    name: Immutable AMD64 image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: docker.io/rmyndharis/openwa@sha256:c00b5b589446ce7dd6177f1b871789284bcfbe3612189ba109465025eb0ad4ec
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'

name: Brunova PoC image security

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - dashboard/package-lock.json
      - scripts/check-image-vex.mjs
      - scripts/check-image-vex.spec.mjs
      - docs/security/openvex.json
      - .github/workflows/brunova-poc-security.yml

permissions:
  contents: read

concurrency:
  group: brunova-poc-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd64-minimal-runtime:
    name: AMD64 minimal runtime + OpenVEX gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build the Brunova AMD64 minimal profile
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: brunova/openwa:poc-security-ci
          build-args: OPENWA_MINIMAL_RUNTIME=true
          no-cache-filters: production
          cache-from: type=gha,scope=brunova-poc-amd64
          cache-to: type=gha,mode=max,scope=brunova-poc-amd64

      - name: Scan without hiding unfixed findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: brunova/openwa:poc-security-ci
          format: json
          output: trivy-ci.json
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'

      - name: Bind reviewed VEX assertions to this build digest
        run: |
          image_id="$(docker image inspect brunova/openwa:poc-security-ci --format '{{.Id}}')"
          jq --arg product "pkg:oci/brunova/openwa@$image_id" \
            '(.statements[].products[]["@id"]) = $product' \
            docs/security/openvex.json > openvex-ci.json
          node scripts/check-image-vex.mjs trivy-ci.json openvex-ci.json trivy-ci-after-vex.json

      - name: Verify non-root runtime contract
        env:
          OPENWA_SMOKE_IMAGE: brunova/openwa:poc-security-ci
        run: ./scripts/smoke-test-non-root.sh

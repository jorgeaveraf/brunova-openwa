# Replace OPENWA_HOSTNAME before installing this file on the VPS.
limit_req_zone $binary_remote_addr zone=openwa_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name OPENWA_HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name OPENWA_HOSTNAME;

    ssl_certificate /etc/letsencrypt/live/OPENWA_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/OPENWA_HOSTNAME/privkey.pem;

    # Create this file with htpasswd and restrict it to root:www-data. Prefer VPN/IP
    # allowlisting in addition when operator addresses are stable.
    auth_basic "OpenWA operators";
    auth_basic_user_file /etc/nginx/openwa.htpasswd;

    client_max_body_size 10m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Streamable HTTP MCP transport. OpenWA remains responsible for validating
    # the bearer/API key; Basic Auth is disabled only for this exact endpoint.
    location = /mcp {
        auth_basic off;
        limit_req zone=openwa_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:2785/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        limit_req zone=openwa_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:2785;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
